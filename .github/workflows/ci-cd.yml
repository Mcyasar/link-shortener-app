name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main branch'ine push yapıldı��nda �al���r

env:
  REGISTRY_IMAGE: mcysrdckr/link_shortener
  GITOPS_REPO: ${{ github.repository_owner }}/link-shortener-gitops
  TARGET_FILE: environments/values-test.yaml

jobs:

  unit-and-integration-tests:
    name: Run Unit & Integration Tests    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Run Tests (Including Testcontainers)
      run: dotnet test --no-restore --configuration Release --verbosity normal

  
  build-and-push:
    name: Build & Push to Docker Hub and Update GitOps
    needs: unit-and-integration-tests
    runs-on: ubuntu-latest
    outputs:
      k6_enabled: ${{ steps.update-gitops-api.outputs.k6_enabled }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.REGISTRY_IMAGE }}:$IMAGE_TAG -f Dockerfile .
          docker push ${{ env.REGISTRY_IMAGE }}:$IMAGE_TAG

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps Manifest via GitHub API (No Clone)
        id: update-gitops-api
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "GitOps reposundaki dosya API üzerinden okunuyor..."
          # 1. Dosyanın mevcut Base64 içeriğini ve Git SHA'sını GitHub API'den çek
          RESPONSE=$(gh api repos/${{ env.GITOPS_REPO }}/contents/${{ env.TARGET_FILE }})
          CURRENT_BLOB_SHA=$(echo "$RESPONSE" | jq -r .sha)
          RAW_CONTENT=$(echo "$RESPONSE" | jq -r .content | tr -d '\n\r' | base64 -d)

          # 2. Mevcut içerikten k6Test.enabled değerini sonraki job için oku
          K6_FLAG=$(echo "$RAW_CONTENT" | yq eval '.k6Test.enabled // false' -)
          echo "k6Test.enabled: $K6_FLAG"
          echo "k6_enabled=$K6_FLAG" >> $GITHUB_OUTPUT

          # 3. yq ile dosya içeriğinde image.tag'i güncelle ve tekrar Base64'e çevir
          UPDATED_BASE64=$(echo "$RAW_CONTENT" | yq eval ".image.tag = \"${{ env.IMAGE_TAG }}\"" - | base64 -w 0)

          # 4. Klonlamadan tek bir HTTP PUT isteğiyle GitOps reposuna commit at
          gh api --method PUT repos/${{ env.GITOPS_REPO }}/contents/${{ env.TARGET_FILE }} \
            -f message="chore(test): update backend image tag to ${{ env.IMAGE_TAG }} [skip ci]" \
            -f content="$UPDATED_BASE64" \
            -f sha="$CURRENT_BLOB_SHA" \
            -f branch="main"

          echo "GitOps reposu API üzerinden güncellendi!"

  performance-test:
    name: Run Ephemeral Performance Task (Test Env)
    needs: build-and-push
    if: needs.build-and-push.outputs.k6_enabled == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for Test Environment Rollout & Ingress Health
        shell: pwsh
        run: |
          Write-Host "Kubernetes test deployment rollout durumu kontrol ediliyor..."
          kubectl rollout status deployment/linkshortener-test -n linkshortener-test --timeout=120s

          Write-Host "Test ortamı Ingress sağlık kontrolü bekleniyor (linkshortener.test)..."

          $attempts = 0
          $maxAttempts = 24
          $success = $false

          while ($attempts -lt $maxAttempts) {
            try {
              # Ingress Host header ile lokal adrese istek atıyoruz
              $response = Invoke-WebRequest -Uri "http://linkshortener.test/api/health" -Headers @{ "Host" = "linkshortener.test" } -UseBasicParsing -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                $success = $true
                break
              }
            } catch {
              # Bağlantı henüz açılmadıysa buraya düşer
            }

            Write-Host "Sağlık kontrolü bekleniyor... Tekrar denenecek (5 sn)"
            Start-Sleep -Seconds 5
            $attempts++
          }

          if (-not $success) {
            Write-Error "Test ortamı Ingress zaman aşımına uğradı ve HTTP 200 dönmedi!"
            exit 1
          }

          Write-Host "Test ortamı ayakta ve yanıt veriyor!"

      - name: Execute k6 Run Task (Docker Ephemeral)
        run: |
          $testsPath = "${{ github.workspace }}\Linkshortener.API\tests".Replace('\', '/')

          docker run --rm `
            -v "${testsPath}:/tests:ro" `
            --add-host=host.docker.internal:host-gateway `
            -e TARGET_BASE_URL="http://host.docker.internal" `
            -e TARGET_HOST_HEADER="linkshortener.test" `
            -e TEST_SHORT_CODE="iZr6N9c" `
            grafana/k6:latest run /tests/load-test.js

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Performans SLA eşikleri aşıldı! Test ortamı SLA hedeflerini karşılayamadı."